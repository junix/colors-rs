" y="144" font-size="10" fill="#28505C" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="400" text-anchor="start">2.4 幂 gamma 解码</text><rect x="430" y="288" width="618" height="76" fill="#DDF2EC" rx="6"/><text x="446" y="310" font-size="11" fill="#17212B" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="600" text-anchor="start">回程映射：色域外不报错——</text><text x="446" y="329" font-size="10.5" fill="#17212B" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="400" text-anchor="start">二分 32 步压 chroma，在保留 lightness 与 hue 的前提下</text><text x="446" y="347" font-size="10.5" fill="#17212B" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="400" text-anchor="start">落回可显示范围；palette / ensure 的修复全部经由它</text><path d="M 536,288 L 536,254" fill="none" stroke="#356A79" stroke-width="1.4" stroke-dasharray="5 4"/><text x="24" y="460" font-size="10" fill="#5D6873" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="start">节点取值 = rebeccapurple 全程冻结（oklab/oklch 为引擎字符串原样；linear 三元组为公式复算、显示 6 位小数，全精度在 data/spaces-chain.json，锚定引擎全精度亮度）</text></svg>
