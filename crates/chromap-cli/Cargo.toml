[package]
name = "chromap-cli"
description = "Command-line interface for the chromap color toolkit"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[[bin]]
name = "chromap"
path = "src/main.rs"
doc = false

[dependencies]
chromap = { path = "../chromap", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
png = "0.18.1"
serde_json = "1.0"

[lints]
workspace = true
