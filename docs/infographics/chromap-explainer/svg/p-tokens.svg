ce" font-weight="400" text-anchor="start">  --brand-6: #749bff;</text><text x="320" y="345" font-size="10" fill="#28505C" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="start">  --brand-7: #99b7ff;</text><text x="320" y="360" font-size="10" fill="#28505C" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="start">  --brand-8: #bfd2ff;</text><text x="320" y="375" font-size="10" fill="#28505C" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="start">  --brand-9: #e5edff;</text><text x="320" y="390" font-size="10" fill="#28505C" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="start">}</text><text x="40" y="418" font-size="9" fill="#5D6873" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="400" text-anchor="start">（--css-prefix 校验 ASCII 字母/数字/-/_，输出可直接入 CSS）</text><rect x="608" y="270" width="440" height="152" fill="#FFFFFF" rx="6" stroke="#D9E1E3" stroke-width="1.1"/><text x="624" y="292" font-size="11.5" fill="#17212B" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="600" text-anchor="start">与库例程对拍：9 级 hex 全等（9/9）</text><text x="624" y="310" font-size="10" fill="#5D6873" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="start">cargo run --package chromap \</text><text x="624" y="325" font-size="10" fill="#5D6873" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="start">  --example design_tokens</text><text x="624" y="345" font-size="9.5" fill="#17212B" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="400" text-anchor="start">自检 #17：例程输出的 9 个 hex 与 CLI 标尺逐一相等</text><text x="624" y="360" font-size="9.5" fill="#17212B" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="400" text-anchor="start">命名口径不同：CLI --css-prefix 给 --brand-1…9</text><text x="624" y="375" font-size="9.5" fill="#17212B" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="400" text-anchor="start">（声明 A-20）；例程自带 --brand-100…900</text><text x="624" y="390" font-size="9.5" fill="#17212B" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="400" text-anchor="start">（内置命名）——两个口径都如实呈现</text><text x="624" y="408" font-size="9.5" fill="#17212B" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="start">PNG 预览 520×80（5 色 1 行：5×10…）</text><text x="624" y="421" font-size="9" fill="#2A9D8F" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="start">双跑 sha256 一致：e19676da1da6632560d5ff0ae3…</text><text x="24" y="498" font-size="10" fill="#5D6873" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="start">data/design-tokens.json（palette + 9×ratio + 库例程对拍）· data/png-freeze.json（两次 --png 运行 sha256 相等）</text></svg>
