#5D6873" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="start">口径注（如实呈现，不合并）：palette/ensure 的 JSON 里 oklch 与 ratio 描述引擎内部 f64 色，hex 是其 8 位量化——</text><text x="24" y="502" font-size="10" fill="#5D6873" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="start">同一 #475c00 重新 convert 得 L 44.1177%（palette 侧 44.0272%）；ensure 报告 4.500000000000004，输出 hex 复测 4.487789210548097（见指标图鉴）。验收要测落盘 hex</text></svg>
